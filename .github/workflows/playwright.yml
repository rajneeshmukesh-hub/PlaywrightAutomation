name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright:
    name: 'Playwright E2E Tests - Ubuntu'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up sequential workflow runs

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Linux Dependencies
        # This matches the 'playwright install chromium' you ran locally
        # adding system-level dependencies required for Ubuntu instances
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Playwright Tests
        # Runs the suite exactly how you called it locally using your pytest.ini options
        run: pytest

      - name: Upload Test HTML & Allure Reports
        if: always() # Ensures reports upload even if tests fail in the future
        uses: actions/upload-artifact@v4
        with:
          name: playright-test-results
          path: reports/
